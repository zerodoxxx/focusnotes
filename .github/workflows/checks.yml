name: checks

on:
  workflow_dispatch:
    inputs:
      full:
        description: Full checks (models, performance, UI galleries, packaging and both Windows architectures)
        type: boolean
        default: false
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

env:
  FOCUSNOTES_PERF_GATES: "0"

concurrency:
  # Skip changes cancel requested work. Unrelated label snapshots cannot cancel it or replace required checks.
  group: checks-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && ((github.event.action == 'labeled' && (github.event.label.name == 'run-ci' || github.event.label.name == 'run-ci-full')) || (github.event.action == 'unlabeled' && github.event.label.name == 'skip-ci') || (contains(github.event.pull_request.labels.*.name, 'skip-ci') && ((github.event.action == 'labeled' && github.event.label.name == 'skip-ci') || github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'))))) && 'requested' || github.run_id }}
  cancel-in-progress: true

jobs:
  select:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name == 'run-ci' || github.event.label.name == 'run-ci-full') && !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
      windows: ${{ steps.scope.outputs.windows }}
      full: ${{ steps.scope.outputs.full }}
      windows-runners: ${{ steps.scope.outputs.windows-runners }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the PR merge checkout for tests; the selector compares the event's base/head SHAs.
          fetch-depth: 0

      - name: Check platform selector
        run: python3 scripts/test-ci-selection.py

      - name: Select platforms and verification level
        id: scope
        env:
          CI_FULL: ${{ inputs.full && 'true' || 'false' }}
        run: python3 scripts/ci_selection.py

  windows-release-gate:
    needs: select
    if: needs.select.outputs.windows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Exercise Windows release gate modes
        run: bash scripts/test-windows-release-gate.sh

  build:
    needs: select
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && ((github.event.action == 'labeled' && (github.event.label.name == 'run-ci' || github.event.label.name == 'run-ci-full')) || (github.event.action == 'unlabeled' && github.event.label.name == 'skip-ci') || (contains(github.event.pull_request.labels.*.name, 'skip-ci') && ((github.event.action == 'labeled' && github.event.label.name == 'skip-ci') || github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'))))) }}
    # Only a request or intentional skip may publish the ruleset's required check name.
    # Run lightweight Ubuntu gates when native work is omitted: GitHub does not
    # evaluate dynamic check names for skipped jobs.
    name: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && ((github.event.action == 'labeled' && (github.event.label.name == 'run-ci' || github.event.label.name == 'run-ci-full')) || (github.event.action == 'unlabeled' && github.event.label.name == 'skip-ci') || (contains(github.event.pull_request.labels.*.name, 'skip-ci') && ((github.event.action == 'labeled' && github.event.label.name == 'skip-ci') || github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'))))) && 'build' || 'build (CI not requested)' }}
    # xcode-27 runner: Xcode 27 (Swift 6.4) is the default toolchain.
    runs-on: ${{ needs.select.result == 'success' && needs.select.outputs.macos == 'true' && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Revoke the intentional skip after skip-ci is removed
        if: ${{ always() && github.event_name == 'pull_request' && github.event.action == 'unlabeled' && github.event.label.name == 'skip-ci' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
        run: |
          echo 'skip-ci was removed. Add run-ci or run-ci-full to request verification before merging.' >&2
          exit 1

      - name: Fail required check when platform selection did not complete
        if: ${{ always() && (cancelled() || needs.select.result == 'failure' || needs.select.result == 'cancelled' || (needs.select.result == 'skipped' && !contains(github.event.pull_request.labels.*.name, 'skip-ci'))) }}
        run: exit 1

      - name: Fail required check when platform selection outputs are incomplete
        if: ${{ always() && needs.select.result == 'success' && ((needs.select.outputs.macos != 'true' && needs.select.outputs.macos != 'false') || (needs.select.outputs.windows != 'true' && needs.select.outputs.windows != 'false') || (needs.select.outputs.full != 'true' && needs.select.outputs.full != 'false')) }}
        run: exit 1

      - name: Complete required build check without a macOS workload
        if: ${{ ((needs.select.result == 'success' && needs.select.outputs.macos == 'false') || (needs.select.result == 'skipped' && contains(github.event.pull_request.labels.*.name, 'skip-ci'))) }}
        run: echo 'No macOS workload selected; required CI policy check completed.'

      - uses: actions/checkout@v7
        if: ${{ needs.select.result == 'success' && needs.select.outputs.macos == 'true' }}

      - name: Select Xcode 27 (Swift 6.4)
        if: ${{ needs.select.result == 'success' && needs.select.outputs.macos == 'true' }}
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Print toolchain
        if: ${{ needs.select.result == 'success' && needs.select.outputs.macos == 'true' }}
        run: |
          swift --version
          sw_vers

      - name: Require Swift 6.4 or newer
        if: ${{ needs.select.result == 'success' && needs.select.outputs.macos == 'true' }}
        run: |
          set -euo pipefail
          version="$(swift --version | sed -n 's/.*Apple Swift version \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -n 1)"
          [[ -n "$version" ]] || { echo "Could not read the Swift version" >&2; exit 1; }
          if [[ "$(printf '%s\n' 6.4 "$version" | sort -V | head -n 1)" != "6.4" ]]; then
            echo "Swift 6.4+ required; got $version" >&2
            exit 1
          fi
          echo "Swift $version"

      - name: Cache SwiftPM build
        if: ${{ needs.select.result == 'success' && needs.select.outputs.macos == 'true' }}
        uses: actions/cache@v6
        with:
          path: .build
          # Source/mode suffixes let successful incremental builds refresh the immutable cache.
          key: swiftpm-v2-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('Sources/**', 'Config/**', 'conformance/**') }}-${{ needs.select.outputs.full }}
          restore-keys: |
            swiftpm-v2-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('Sources/**', 'Config/**', 'conformance/**') }}-
            swiftpm-v2-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-

      - name: Quick build and core checks
        if: ${{ needs.select.result == 'success' && needs.select.outputs.macos == 'true' && needs.select.outputs.full == 'false' }}
        run: |
          swift build
          swift run --skip-build CoreChecks --skip-performance
          bash scripts/test-app-path-safety.sh

      # Known flaky: `swift run OverlayGallery --check` (run inside release.sh --adhoc) can fail
      # intermittently. If this step fails there, re-run the job; do not special-case it here.
      - name: Checks and ad-hoc DMG
        if: ${{ needs.select.result == 'success' && needs.select.outputs.macos == 'true' && needs.select.outputs.full == 'true' }}
        env:
          # Vision OCR does not work in GitHub's macOS VMs; CaptureChecks then skips only OCR.
          CAPTURE_CHECKS_ALLOW_OCR_SKIP: "1"
        run: scripts/release.sh --adhoc

      - name: Upload dist
        if: ${{ needs.select.result == 'success' && needs.select.outputs.macos == 'true' && needs.select.outputs.full == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: focusnotes-adhoc-dmg
          path: dist/
          retention-days: 3

      - name: Fail required build check if the workflow was cancelled
        if: always() && cancelled()
        run: exit 1

  smoke-macos-15:
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && ((github.event.action == 'labeled' && (github.event.label.name == 'run-ci' || github.event.label.name == 'run-ci-full')) || (github.event.action == 'unlabeled' && github.event.label.name == 'skip-ci') || (contains(github.event.pull_request.labels.*.name, 'skip-ci') && ((github.event.action == 'labeled' && github.event.label.name == 'skip-ci') || github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'))))) }}
    name: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && ((github.event.action == 'labeled' && (github.event.label.name == 'run-ci' || github.event.label.name == 'run-ci-full')) || (github.event.action == 'unlabeled' && github.event.label.name == 'skip-ci') || (contains(github.event.pull_request.labels.*.name, 'skip-ci') && ((github.event.action == 'labeled' && github.event.label.name == 'skip-ci') || github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'))))) && 'smoke-macos-15' || 'smoke-macos-15 (CI not requested)' }}
    needs: [select, build]
    runs-on: ${{ needs.select.result == 'success' && needs.build.result == 'success' && needs.select.outputs.full == 'true' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Fail required smoke check when prerequisite checks did not complete
        if: ${{ always() && (cancelled() || needs.select.result == 'failure' || needs.select.result == 'cancelled' || needs.build.result != 'success') }}
        run: exit 1

      - name: Complete required smoke check without a full macOS workload
        if: ${{ needs.build.result == 'success' && ((needs.select.result == 'success' && needs.select.outputs.full == 'false') || (needs.select.result == 'skipped' && contains(github.event.pull_request.labels.*.name, 'skip-ci'))) }}
        run: echo 'No full macOS workload selected; required CI policy check completed.'

      - name: Download ad-hoc DMG
        if: ${{ needs.select.result == 'success' && needs.build.result == 'success' && needs.select.outputs.full == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: focusnotes-adhoc-dmg
          path: dist

      - name: Mount, verify signature and self-test on macOS 15
        if: ${{ needs.select.result == 'success' && needs.build.result == 'success' && needs.select.outputs.full == 'true' }}
        timeout-minutes: 2
        env:
          MNT: ${{ runner.temp }}/mnt
          STATE: ${{ runner.temp }}/selftest
        run: |
          set -euo pipefail
          mkdir -p "$MNT" "$STATE"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" dist/*.dmg
          app="$MNT/focusnotes.app"
          codesign --verify --strict --verbose=2 "$app"
          # Self-test runs without UI. Exits non-zero on failure. Timeout is enforced by timeout-minutes (2 min).
          "$app/Contents/MacOS/focusnotes" --self-test "$STATE"

      - name: Detach DMG
        if: always() && needs.select.result == 'success' && needs.build.result == 'success' && needs.select.outputs.full == 'true'
        env:
          MNT: ${{ runner.temp }}/mnt
        run: |
          hdiutil detach "$MNT" -force || true

      - name: Fail required smoke check if the workflow was cancelled
        if: always() && cancelled()
        run: exit 1

  windows:
    needs: select
    if: needs.select.outputs.windows == 'true'
    timeout-minutes: 35
    defaults:
      run:
        working-directory: windows
    strategy:
      fail-fast: true
      matrix:
        runner: ${{ fromJSON(needs.select.outputs.windows-runners) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json
          cache: true
          cache-dependency-path: windows/**/packages.lock.json

      - name: Cache semantic models
        if: needs.select.outputs.full == 'true'
        uses: actions/cache@v6
        with:
          path: windows/.semantic-models
          key: semantic-models-${{ runner.os }}-${{ hashFiles('windows/src/CaptureApp.ModelInstall/ModelManifest.cs') }}

      - name: Fetch and verify semantic models
        if: needs.select.outputs.full == 'true'
        shell: pwsh
        run: ./scripts/fetch-semantic-models.ps1

      - name: Restore locked dependencies
        run: dotnet restore CaptureApp.sln --locked-mode

      - name: Build
        run: dotnet build CaptureApp.sln -c Release --no-restore -warnaserror

      - name: Functional tests
        timeout-minutes: 15
        env:
          CAPTUREAPP_REQUIRE_OCR_MODELS: "1"
          CAPTUREAPP_MODELS_DIR: ${{ needs.select.outputs.full == 'true' && format('{0}/windows/.semantic-models', github.workspace) || '' }}
          CAPTUREAPP_REQUIRE_MODELS: ${{ needs.select.outputs.full == 'true' && '1' || '0' }}
        # Separate test assemblies otherwise compete with the desktop/UIA fixtures and model inference.
        run: dotnet test CaptureApp.sln -c Release --no-build --filter "Category!=Perf" -m:1 --logger trx --results-directory TestResults/tests

      - name: Performance measurements and workload checks
        if: needs.select.outputs.full == 'true'
        timeout-minutes: 15
        env:
          CAPTUREAPP_REQUIRE_OCR_MODELS: "1"
          CAPTUREAPP_MODELS_DIR: ${{ github.workspace }}/windows/.semantic-models
          CAPTUREAPP_REQUIRE_MODELS: "1"
        # Workload correctness remains required; elapsed timings are diagnostic on shared runners.
        run: dotnet test CaptureApp.sln -c Release --no-build --filter "Category=Perf" -m:1 --logger "console;verbosity=detailed" --logger trx --results-directory TestResults/perf

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.runner }}
          path: windows/TestResults/
          retention-days: 3
          if-no-files-found: warn

      - name: Publish and self-test
        if: needs.select.outputs.full == 'true'
        shell: pwsh
        timeout-minutes: 3
        env:
          CAPTUREAPP_REQUIRE_OCR_MODELS: "1"
          CAPTUREAPP_MODELS_DIR: ${{ github.workspace }}/windows/.semantic-models
          CAPTUREAPP_REQUIRE_MODELS: "1"
        run: |
          $rid = "win-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}"
          $publishDir = Join-Path $env:RUNNER_TEMP 'publish'
          dotnet publish src/CaptureApp.App -c Release -r $rid --self-contained -o $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $appName = (Select-String -Path "$env:GITHUB_WORKSPACE/Config/app.env" -Pattern '^APPNAME=(.+)$').Matches[0].Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($appName)) { throw 'Config/app.env does not define APPNAME' }
          $exe = Join-Path $publishDir "$appName.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Published app executable not found: $exe" }
          Write-Host "Running published self-test: $exe"
          $started = Get-Date
          & $exe --self-test "$env:RUNNER_TEMP/selftest" --models "$env:CAPTUREAPP_MODELS_DIR" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/selftest.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # A crash leaves no managed output; the runtime and WER entries name the faulting module and exception.
            Write-Host "Self-test exited with $code"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $started } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
              ForEach-Object { Write-Host "[$($_.ProviderName)] $($_.Message)" }
            Get-ChildItem "$env:RUNNER_TEMP/selftest" -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
            exit $code
          }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/selftest.log" -Pattern "architecture .* \(runtime $rid\)" -Quiet)) { throw "Self-test did not report architecture $rid" }

      - name: Gallery
        if: needs.select.outputs.full == 'true'
        id: gallery
        shell: pwsh
        run: |
          dotnet run --project src/CaptureApp.Gallery/CaptureApp.Gallery.csproj -c Release --no-build -- --check "$env:RUNNER_TEMP/gallery"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload gallery
        if: ${{ !cancelled() && steps.gallery.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: gallery-${{ matrix.runner }}
          path: ${{ runner.temp }}/gallery
          retention-days: 3
          if-no-files-found: error

      - name: Probe runner desktop capabilities
        if: ${{ !cancelled() && (failure() || needs.select.outputs.full == 'true') }}
        continue-on-error: true
        timeout-minutes: 2
        shell: pwsh
        run: |
          dotnet run --project tools/RunnerProbe/CaptureApp.RunnerProbe.csproj -c Release --no-build |
            Tee-Object -FilePath ../runner-probe.md
          Get-Content ../runner-probe.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload runner capability table
        if: ${{ always() && (failure() || needs.select.outputs.full == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: runner-probe-${{ matrix.runner }}
          path: runner-probe.md
          retention-days: 3
          if-no-files-found: warn

  windows-package:
    needs: select
    if: needs.select.outputs.full == 'true'
    # Packs two CI versions per architecture, then proves install, signed-index update and tamper refusal.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        runner: [windows-latest, windows-11-arm]
    env:
      CI_UPDATE_PORT: "8765"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json
          cache: true
          cache-dependency-path: windows/**/packages.lock.json

      - name: Pack two CI versions
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $base = (Select-String -Path Config/app.env -Pattern '^VERSION=(.+)$').Matches[0].Groups[1].Value
          "ARCH=$arch" | Add-Content $env:GITHUB_ENV
          foreach ($n in 1, 2) {
            ./windows/scripts/pack.ps1 -Arch $arch -Version "$base-ci.$n" -OutDir "$env:RUNNER_TEMP/pack/v$n" -CiUpdateTests
          }

      - name: Install, update and tamper test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appName = (Select-String -Path Config/app.env -Pattern '^APPNAME=(.+)$').Matches[0].Groups[1].Value
          $rid = "win-$env:ARCH"
          $packId = "$appName-$rid"
          $v1 = "$env:RUNNER_TEMP/pack/v1/$rid"
          $v2 = "$env:RUNNER_TEMP/pack/v2/$rid"

          # Throwaway signing key, trusted only through the CI-build override.
          $keyFile = Join-Path $env:RUNNER_TEMP 'ci-update-key.txt'
          dotnet build windows/tools/IndexSigner -c Release --artifacts-path "$env:RUNNER_TEMP/signer"
          if ($LASTEXITCODE -ne 0) { throw 'IndexSigner build failed' }
          $signer = "$env:RUNNER_TEMP/signer/bin/CaptureApp.IndexSigner/release/CaptureApp.IndexSigner.dll"
          $trusted = @(dotnet $signer keygen --out $keyFile)[-1]
          if ($LASTEXITCODE -ne 0) { throw 'keygen failed' }
          $keyId = $trusted.Split(':')[0]
          function Sign-Index { dotnet $signer sign --key-file $keyFile --key-id $keyId --channel $rid "$v2/releases.$rid.json"; if ($LASTEXITCODE -ne 0) { throw 'sign failed' } }
          Sign-Index
          $env:CAPTUREAPP_UPDATE_KEYS_OVERRIDE = $trusted
          $env:CAPTUREAPP_UPDATE_URL_OVERRIDE = "http://127.0.0.1:$env:CI_UPDATE_PORT/"

          $server = Start-Job -ArgumentList $v2, $env:CI_UPDATE_PORT -ScriptBlock {
            param($root, $port)
            $listener = [System.Net.HttpListener]::new()
            $listener.Prefixes.Add("http://127.0.0.1:$port/")
            $listener.Start()
            while ($listener.IsListening) {
              $context = $listener.GetContext()
              $path = Join-Path $root ([Uri]::UnescapeDataString($context.Request.Url.AbsolutePath.TrimStart('/')))
              if (Test-Path -LiteralPath $path -PathType Leaf) {
                $bytes = [System.IO.File]::ReadAllBytes($path)
                $context.Response.ContentLength64 = $bytes.Length
                $context.Response.OutputStream.Write($bytes, 0, $bytes.Length)
              } else { $context.Response.StatusCode = 404 }
              $context.Response.Close()
            }
          }

          function Invoke-App([string[]] $Arguments) {
            $out = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N') + '.txt')
            $process = Start-Process -FilePath $exe -ArgumentList $Arguments -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError "$out.err"
            [pscustomobject]@{ Code = $process.ExitCode; Out = (Get-Content -Raw -Path $out -ErrorAction SilentlyContinue) + (Get-Content -Raw -Path "$out.err" -ErrorAction SilentlyContinue) }
          }
          function Assert-Contains($Result, [string] $Text) {
            if ($Result.Out -notmatch [regex]::Escape($Text)) { throw "Expected '$Text' in: $($Result.Out)" }
          }

          try {
            $setup = Join-Path $v1 "$packId-Setup.exe"
            Start-Process -FilePath $setup -ArgumentList '--silent' -Wait
            $exe = Join-Path $env:LOCALAPPDATA "$packId/current/$appName.exe"
            if (-not (Test-Path -LiteralPath $exe)) { throw "Installed exe not found at $exe" }

            $info = Invoke-App @('--ci-update', 'info')
            $processArch = if ($env:ARCH -eq 'arm64') { 'Arm64' } else { 'X64' }
            Assert-Contains $info "arch=$processArch"
            Assert-Contains $info "channel=$rid"
            Assert-Contains $info '-ci.1'

            $selfTest = Invoke-App @('--self-test', (Join-Path $env:RUNNER_TEMP 'installed-self-test'))
            if ($selfTest.Code -ne 0) { throw "Installed --self-test failed: $($selfTest.Out)" }

            # Tampered index and missing signature are refused.
            $index = "$v2/releases.$rid.json"
            $original = [System.IO.File]::ReadAllBytes($index)
            [System.IO.File]::WriteAllBytes($index, $original + [byte[]] (32))
            $tampered = Invoke-App @('--ci-update', 'check')
            if ($tampered.Code -ne 3) { throw "Tampered index was not refused: $($tampered.Out)" }
            Assert-Contains $tampered 'status=CheckFailed'
            [System.IO.File]::WriteAllBytes($index, $original)
            Move-Item "$index.sig" "$index.sig.off"
            $unsigned = Invoke-App @('--ci-update', 'check')
            if ($unsigned.Code -ne 3) { throw "Unsigned index was not refused: $($unsigned.Out)" }
            Move-Item "$index.sig.off" "$index.sig"

            $check = Invoke-App @('--ci-update', 'check')
            if ($check.Code -ne 0) { throw "Valid update check failed: $($check.Out)" }
            Assert-Contains $check 'status=ReadyToRestart'

            Invoke-App @('--ci-update', 'apply') | Out-Null
            $deadline = (Get-Date).AddMinutes(3)
            do {
              Start-Sleep -Seconds 3
              $after = Invoke-App @('--ci-update', 'info')
            } until ($after.Out -match '-ci\.2' -or (Get-Date) -gt $deadline)
            Assert-Contains $after '-ci.2'
            Assert-Contains $after "arch=$processArch"
          }
          finally {
            Stop-Job $server -ErrorAction SilentlyContinue
          }

          Copy-Item -LiteralPath (Join-Path $v1 "$packId-Setup.exe") -Destination (Join-Path $env:RUNNER_TEMP 'upload-setup.exe')
          ./windows/scripts/signing-inventory.ps1 -Layout (Join-Path $env:LOCALAPPDATA $packId) -Packages $v2 -Out (Join-Path $env:RUNNER_TEMP "signing-inventory-$env:ARCH.json")

      - name: Upload signing inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-package-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/signing-inventory-*.json
            ${{ runner.temp }}/upload-setup.exe
          retention-days: 3
          if-no-files-found: warn
