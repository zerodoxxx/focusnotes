name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example, 0.1.2)
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - Config/app.env

permissions:
  contents: read

env:
  FOCUSNOTES_PERF_GATES: "0"

# Do not overlap version preparation with a release already in progress.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare version commit and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo "Run this workflow from the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          }

          git fetch --no-tags origin "$DEFAULT_BRANCH"
          checked_out_commit="$(git rev-parse HEAD)"
          latest_commit="$(git rev-parse FETCH_HEAD)"
          [[ "$checked_out_commit" == "$GITHUB_SHA" && "$latest_commit" == "$GITHUB_SHA" ]] || {
            echo "The selected default-branch commit is stale. Start a new run from the latest $DEFAULT_BRANCH." >&2
            exit 1
          }

          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Version must use stable major.minor.patch form without a leading v, for example 0.1.2." >&2
            exit 1
          }

          current_version=""
          current_build=""
          while IFS= read -r line; do
            key="${line%%=*}"
            value="${line#*=}"
            case "$key" in
              VERSION) current_version="$value" ;;
              BUILD) current_build="$value" ;;
            esac
          done < Config/app.env
          [[ "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "VERSION in Config/app.env is not a stable major.minor.patch version." >&2
            exit 1
          }
          [[ "$current_build" =~ ^[1-9][0-9]*$ ]] || {
            echo "BUILD in Config/app.env must be a positive integer." >&2
            exit 1
          }

          if [[ "$RELEASE_VERSION" != "$current_version" ]]; then
            lowest_version="$(printf '%s\n' "$current_version" "$RELEASE_VERSION" | sort -V | head -n 1)"
            [[ "$lowest_version" == "$current_version" ]] || {
              echo "Requested version $RELEASE_VERSION is older than Config/app.env VERSION=$current_version." >&2
              exit 1
            }
          fi

          tag="v$RELEASE_VERSION"
          set +e
          tag_refs="$(git ls-remote --exit-code --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" 2>&1)"
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              echo "Tag $tag already exists. Choose a version that has never been tagged." >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "$tag_refs" >&2
              echo "Could not check whether $tag already exists on origin." >&2
              exit 1
              ;;
          esac

          release_error="$RUNNER_TEMP/release-lookup-error.txt"
          if gh api "repos/$GH_REPO/releases/tags/$tag" >/dev/null 2>"$release_error"; then
            echo "A GitHub release for $tag already exists. Choose a version that has never been released." >&2
            exit 1
          elif ! grep -q 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            echo "Could not check whether a GitHub release for $tag already exists." >&2
            exit 1
          fi

          next_build=$((current_build + 1))
          branch="codex-release-v${RELEASE_VERSION}-build${next_build}-${GITHUB_RUN_ID}"
          open_release_prs="$(gh pr list --repo "$GH_REPO" --base "$DEFAULT_BRANCH" --state open --json headRefName,url --jq '.[] | select(.headRefName | startswith("codex-release-v")) | [.headRefName, .url] | @tsv')"
          while IFS=$'\t' read -r open_branch open_url; do
            [[ -n "$open_branch" ]] || continue
            if [[ "$open_branch" == "$branch" ]]; then
              {
                echo "## Version pull request is ready"
                echo "Existing PR: $open_url"
                echo
                echo "Review and merge it to start the release build."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Version pull request already exists: $open_url"
              exit 0
            fi
            echo "Another release version PR is open: $open_url. Merge or close it before starting another release." >&2
            exit 1
          done <<< "$open_release_prs"

          compare_url="https://github.com/$GH_REPO/compare/$DEFAULT_BRANCH...$branch?expand=1"
          set +e
          existing_branch="$(git ls-remote --exit-code --heads origin "refs/heads/$branch" 2>&1)"
          branch_status=$?
          set -e
          case "$branch_status" in
            0)
              {
                echo "## Version pull request needs manual creation"
                echo "The version branch already exists: [open a PR]($compare_url)"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Branch $branch already exists without an open PR. Inspect it and open a PR: $compare_url" >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "$existing_branch" >&2
              echo "Could not check whether branch $branch already exists." >&2
              exit 1
              ;;
          esac

          updated_env="$(mktemp)"
          awk -v version="$RELEASE_VERSION" -v build="$next_build" '
            /^VERSION=/ { print "VERSION=" version; version_found=1; next }
            /^BUILD=/ { print "BUILD=" build; build_found=1; next }
            { print }
            END {
              if (!version_found || !build_found) exit 1
            }
          ' Config/app.env > "$updated_env"
          mv "$updated_env" Config/app.env

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Config/app.env
          git commit -m "Bump version to $RELEASE_VERSION (build $next_build)"
          if ! git push origin "HEAD:refs/heads/$branch"; then
            echo "Could not push the version branch. Check that this workflow can write repository contents; main was not changed." >&2
            exit 1
          fi

          pr_body="$RUNNER_TEMP/release-pr-body.md"
          cat > "$pr_body" <<EOF
          This PR prepares release v$RELEASE_VERSION (build $next_build).

          Merging it to $DEFAULT_BRANCH starts the signed release build and creates a draft release for review.
          EOF

          if pr_url="$(gh pr create --repo "$GH_REPO" --base "$DEFAULT_BRANCH" --head "$branch" --title "Release v$RELEASE_VERSION (build $next_build)" --body-file "$pr_body" 2>&1)"; then
            {
              echo "## Version pull request is ready"
              echo "Review and merge: $pr_url"
              echo
              echo "After merge, the release workflow will build and create a draft release."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Version pull request: $pr_url"
          else
            pr_error="$pr_url"
            existing_pr="$(gh pr list --repo "$GH_REPO" --head "$branch" --base "$DEFAULT_BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)"
            if [[ -n "$existing_pr" ]]; then
              {
                echo "## Version pull request is ready"
                echo "Review and merge: $existing_pr"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Version pull request exists: $existing_pr"
            else
              if [[ "$pr_error" == *"GitHub Actions is not permitted to create or approve pull requests (createPullRequest)"* ]]; then
                {
                  echo "## Action required: create the version pull request"
                  printf 'The version commit for v%s (build %s) is on branch `%s`.\n\n' "$RELEASE_VERSION" "$next_build" "$branch"
                  printf '[Open a PR from this branch](%s). No release has been built yet.\n\n' "$compare_url"
                  echo "A repository admin can review Settings → Actions → General → Allow GitHub Actions to create and approve pull requests if this permission block is unexpected or persists."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "::warning title=Manual PR required::The version commit is ready on $branch; open a PR to start the release flow: $compare_url"
                echo "GitHub blocked PR creation because the repository does not permit the workflow token to create pull requests." >&2
              else
                {
                  echo "## Pull request creation failed"
                  printf 'The version commit for v%s (build %s) is on branch `%s`.\n\n' "$RELEASE_VERSION" "$next_build" "$branch"
                  printf '[Open a PR from this branch](%s) to continue.\n\n' "$compare_url"
                  echo "The automatic PR attempt failed for an unexpected reason; see the workflow log before retrying."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "Unexpected PR creation failure. The version branch remains available at $compare_url" >&2
                printf '%s\n' "$pr_error" >&2
                exit 1
              fi
            fi
          fi

  # Windows assets are part of every release. Authenticode signing is optional, but if configured all
  # three signing inputs must be present; partial configuration fails instead of silently downgrading.
  # Ed25519 update-index signing remains required in both modes.
  windows-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      signing_enabled: ${{ steps.gate.outputs.signing_enabled }}
    steps:
      - uses: actions/checkout@v7

      - id: gate
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          WINDOWS_SIGN_TEMPLATE: ${{ secrets.WINDOWS_SIGN_TEMPLATE }}
          WINDOWS_SIGNER_THUMBPRINTS: ${{ vars.WINDOWS_SIGNER_THUMBPRINTS }}
          WINDOWS_UPDATE_ED_KEY_1: ${{ secrets.WINDOWS_UPDATE_ED_KEY_1 }}
        run: |
          bash scripts/windows-release-gate.sh Config/app.env

  windows:
    needs: windows-gate
    if: needs.windows-gate.outputs.enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # Read-only: this job can upload workflow artifacts but cannot touch a release.
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json

      - name: Pack
        shell: pwsh
        env:
          WINDOWS_SIGN_TEMPLATE: ${{ secrets.WINDOWS_SIGN_TEMPLATE }}
          # For the template to reference by name (for example %SIGNPATH_API_TOKEN%), never inline.
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $version = (Select-String -Path Config/app.env -Pattern '^VERSION=(.+)$').Matches[0].Groups[1].Value
          ./windows/scripts/pack.ps1 -Arch '${{ matrix.arch }}' -Version $version -OutDir "$env:RUNNER_TEMP/pack"

      - name: Signing inventory (enforced when Authenticode is configured)
        shell: pwsh
        env:
          WINDOWS_SIGNER_THUMBPRINTS: ${{ vars.WINDOWS_SIGNER_THUMBPRINTS }}
        run: |
          $appName = (Select-String -Path Config/app.env -Pattern '^APPNAME=(.+)$').Matches[0].Groups[1].Value
          $packId = "$appName-win-${{ matrix.arch }}"
          $packages = "$env:RUNNER_TEMP/pack/win-${{ matrix.arch }}"
          Start-Process -FilePath (Join-Path $packages "$packId-Setup.exe") -ArgumentList '--silent' -Wait
          # Hashtable splat: array splatting binds '-Layout' etc. positionally to PowerShell scripts.
          $inventoryArgs = @{ Layout = (Join-Path $env:LOCALAPPDATA $packId); Packages = $packages; Out = "$packages/signing-inventory-${{ matrix.arch }}.json" }
          if ('${{ needs.windows-gate.outputs.signing_enabled }}' -eq 'true') { $inventoryArgs.Enforce = $true }
          ./windows/scripts/signing-inventory.ps1 @inventoryArgs

      - uses: actions/upload-artifact@v7
        with:
          name: windows-release-${{ matrix.arch }}
          path: ${{ runner.temp }}/pack/win-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [windows-gate, windows]
    # Runs after the Windows gate and both architecture builds succeed; never after a Windows failure.
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.windows-gate.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    # xcode-27 runner: Xcode 27 (Swift 6.4) is the default toolchain.
    runs-on: xcode-27
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo "Release builds run only from the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          }

          version=""
          build=""
          while IFS= read -r line; do
            key="${line%%=*}"
            value="${line#*=}"
            case "$key" in
              VERSION) version="$value" ;;
              BUILD) build="$value" ;;
            esac
          done < Config/app.env
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "VERSION in Config/app.env must use stable major.minor.patch form." >&2
            exit 1
          }
          [[ "$build" =~ ^[1-9][0-9]*$ ]] || {
            echo "BUILD in Config/app.env must be a positive integer." >&2
            exit 1
          }

          tag="v$version"
          set +e
          tag_refs="$(git ls-remote --exit-code --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" 2>&1)"
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              echo "Tag $tag already exists. The version PR cannot be released; choose a new version." >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "$tag_refs" >&2
              echo "Could not check whether $tag already exists on origin." >&2
              exit 1
              ;;
          esac

          release_error="$RUNNER_TEMP/release-lookup-error.txt"
          if gh api "repos/$GH_REPO/releases/tags/$tag" >/dev/null 2>"$release_error"; then
            echo "A GitHub release for $tag already exists. No files were changed." >&2
            exit 1
          elif ! grep -q 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            echo "Could not check whether a GitHub release for $tag already exists." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

      - name: Select Xcode 27 (Swift 6.4)
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Print toolchain
        run: |
          swift --version
          sw_vers

      - name: Require Swift 6.4 or newer
        run: |
          set -euo pipefail
          version="$(swift --version | sed -n 's/.*Apple Swift version \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -n 1)"
          [[ -n "$version" ]] || { echo "Could not read the Swift version" >&2; exit 1; }
          if [[ "$(printf '%s\n' 6.4 "$version" | sort -V | head -n 1)" != "6.4" ]]; then
            echo "Swift 6.4+ required; got $version" >&2
            exit 1
          fi
          echo "Swift $version"

      - name: Resolve models directory
        id: models-dir
        run: echo "dir=$HOME/Library/Application Support/com.zerodoxxx.focusnotes/models" >> "$GITHUB_OUTPUT"

      - name: Cache models
        uses: actions/cache@v6
        with:
          path: ${{ steps.models-dir.outputs.dir }}
          key: models-${{ hashFiles('Sources/EmbedKit/ModelManifest.swift') }}

      - name: Fetch models
        env:
          MODELS_DIR: ${{ steps.models-dir.outputs.dir }}
        run: scripts/fetch-models.sh "$MODELS_DIR"

      - name: Import signing identity
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          scripts/import-signing-identity.sh "$RUNNER_TEMP/identity.p12" "$RUNNER_TEMP/signing.keychain-db"

      - name: Tag the version locally
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION appeared after preflight; no tag was created by this run." >&2
            exit 1
          fi
          git tag -a "v$VERSION" -m "focusnotes $VERSION"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Build, sign and verify release
        env:
          RELEASE_FROM_TAG: "1"
          CAPTURE_CHECKS_ALLOW_OCR_SKIP: "1"
          SIGN_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/release.sh

      - name: Set up .NET for Windows index signing
        if: needs.windows-gate.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json

      - name: Sign Windows update indexes and add to checksums
        if: needs.windows-gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WINDOWS_UPDATE_ED_KEY_1: ${{ secrets.WINDOWS_UPDATE_ED_KEY_1 }}
        run: |
          set -euo pipefail
          keys="$(sed -n 's/^WINDOWS_UPDATE_ED_KEYS=//p' Config/app.env | head -n 1)"
          key_id="$(cut -d, -f1 <<<"$keys" | cut -d: -f1)"
          [[ -n "$key_id" ]] || { echo "WINDOWS_UPDATE_ED_KEYS is empty in Config/app.env; run scripts/make-windows-update-key.sh 1." >&2; exit 1; }

          rm -rf windows-dist
          gh run download "$GITHUB_RUN_ID" --pattern 'windows-release-*' --dir windows-dist
          dups="$(find windows-dist -type f -exec basename {} \; | sort | uniq -d)"
          [[ -z "$dups" ]] || { echo "Duplicate Windows asset names across architectures:" >&2; echo "$dups" >&2; exit 1; }

          dotnet build windows/tools/IndexSigner -c Release --artifacts-path "$RUNNER_TEMP/signer" >/dev/null
          signer="$RUNNER_TEMP/signer/bin/CaptureApp.IndexSigner/release/CaptureApp.IndexSigner.dll"
          for index in windows-dist/*/releases.win-*.json; do
            channel="$(basename "$index" .json)"; channel="${channel#releases.}"
            dotnet "$signer" sign --key-env WINDOWS_UPDATE_ED_KEY_1 --key-id "$key_id" --channel "$channel" "$index"
            dotnet "$signer" verify --keys "$keys" --channel "$channel" "$index"
          done
          [[ -n "$(ls windows-dist/*/releases.win-*.json 2>/dev/null)" ]] || { echo "No Windows release indexes were downloaded." >&2; exit 1; }

          find windows-dist -type f ! -name 'signing-inventory-*.json' -exec cp {} dist/ \;
          (
            cd dist
            for file in $(find ../windows-dist -type f ! -name 'signing-inventory-*.json' -exec basename {} \; | sort); do
              shasum -a 256 "$file" >> SHA256SUMS.txt
            done
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Attest DMG
        uses: actions/attest@v4
        with:
          subject-path: dist/*.dmg

      - name: Attest Windows assets
        if: needs.windows-gate.outputs.enabled == 'true'
        uses: actions/attest@v4
        with:
          subject-path: dist/*-win-*

      - name: Push release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git push origin "refs/tags/v$VERSION:refs/tags/v$VERSION"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          WINDOWS_ENABLED: ${{ needs.windows-gate.outputs.enabled }}
        run: |
          set -euo pipefail
          appname="$(sed -n 's/^APPNAME=//p' Config/app.env | head -n 1)"
          [[ -n "$appname" ]] || { echo "APPNAME is missing in Config/app.env" >&2; exit 1; }
          assets=(dist/*.dmg dist/SHA256SUMS.txt dist/appcast.xml)
          if [[ "$WINDOWS_ENABLED" == "true" ]]; then
            while IFS= read -r file; do assets+=("dist/$(basename "$file")"); done < <(find windows-dist -type f ! -name 'signing-inventory-*.json' | sort)
          fi
          gh release create "v$VERSION" --draft --verify-tag --title "$appname $VERSION" --generate-notes "${assets[@]}"

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/identity.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Delete this run's tag after a failed release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_CREATED: ${{ steps.tag.outputs.created }}
        run: |
          set -euo pipefail
          [[ "$TAG_CREATED" == "true" ]] || exit 0
          tag="v$VERSION"
          if ! local_tag="$(git rev-parse --verify "refs/tags/$tag" 2>/dev/null)"; then
            exit 0
          fi
          remote_tag="$(git ls-remote origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          [[ -n "$remote_tag" && "$remote_tag" == "$local_tag" ]] || exit 0

          release_error="$RUNNER_TEMP/release-cleanup-error.txt"
          if gh api "repos/$GH_REPO/releases/tags/$tag" >/dev/null 2>"$release_error"; then
            echo "A release for $tag exists; leaving the release and tag untouched. Inspect it before retrying." >&2
            exit 0
          elif ! grep -q 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            echo "Could not confirm whether a release for $tag exists; leaving the tag in place." >&2
            exit 1
          fi
          git push origin --delete "refs/tags/$tag"
