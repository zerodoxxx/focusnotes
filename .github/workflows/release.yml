name: release on version bump

on:
  push:
    branches: [main]
    paths: [Config/app.env]
  workflow_dispatch:

permissions:
  contents: read

# Runs for different versions must not overlap; never cancel a release in progress.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version and check for an existing tag
        id: version
        run: |
          set -euo pipefail
          version=""
          build=""
          while IFS= read -r line; do
            key="${line%%=*}"
            value="${line#*=}"
            case "$key" in
              VERSION) version="$value" ;;
              BUILD) build="$value" ;;
            esac
          done < Config/app.env
          [[ -n "$version" ]] || { echo "VERSION is missing in Config/app.env" >&2; exit 1; }
          [[ -n "$build" ]] || { echo "BUILD is missing in Config/app.env" >&2; exit 1; }
          echo "VERSION=$version BUILD=$build"

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null
          rc=$?
          set -e
          case "$rc" in
            0) release=false; echo "Tag v$version already exists; nothing to release" ;;
            2) release=true; echo "Tag v$version is absent; releasing" ;;
            *) echo "git ls-remote failed (exit $rc)" >&2; exit 1 ;;
          esac

          {
            echo "version=$version"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    # xcode-27 runner: Xcode 27 (Swift 6.4) is the default toolchain.
    runs-on: xcode-27
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode 27 (Swift 6.4)
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Print toolchain
        run: |
          swift --version
          sw_vers

      - name: Require Swift 6.4 or newer
        run: |
          set -euo pipefail
          version="$(swift --version | sed -n 's/.*Apple Swift version \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -n 1)"
          [[ -n "$version" ]] || { echo "Could not read the Swift version" >&2; exit 1; }
          if [[ "$(printf '%s\n' 6.4 "$version" | sort -V | head -n 1)" != "6.4" ]]; then
            echo "Swift 6.4+ required; got $version" >&2
            exit 1
          fi
          echo "Swift $version"

      - name: Resolve models directory
        id: models-dir
        run: echo "dir=$HOME/Library/Application Support/com.zerodoxxx.focusnotes/models" >> "$GITHUB_OUTPUT"

      - name: Cache models
        uses: actions/cache@v6
        with:
          path: ${{ steps.models-dir.outputs.dir }}
          key: models-${{ hashFiles('Sources/EmbedKit/ModelManifest.swift') }}

      - name: Fetch models
        env:
          MODELS_DIR: ${{ steps.models-dir.outputs.dir }}
        run: scripts/fetch-models.sh "$MODELS_DIR"

      - name: Import signing identity
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          scripts/import-signing-identity.sh "$RUNNER_TEMP/identity.p12" "$RUNNER_TEMP/signing.keychain-db"

      - name: Tag the version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "focusnotes $VERSION"
          git push origin "v$VERSION"

      - name: Build, sign and verify release
        env:
          RELEASE_FROM_TAG: "1"
          SIGN_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/release.sh

      - name: Attest DMG
        uses: actions/attest@v4
        with:
          subject-path: dist/*.dmg

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          appname="$(sed -n 's/^APPNAME=//p' Config/app.env | head -n 1)"
          [[ -n "$appname" ]] || { echo "APPNAME is missing in Config/app.env" >&2; exit 1; }
          gh release create "v$VERSION" --draft --verify-tag --title "$appname $VERSION" --generate-notes dist/*.dmg dist/SHA256SUMS.txt dist/appcast.xml

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/identity.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Delete the tag after a failed run
        if: failure()
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            git push --delete origin "v$VERSION"
          fi
